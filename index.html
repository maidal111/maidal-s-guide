function getTodaySchedule(){

    const now = new Date();
    const hour = now.getHours();
    const minute = now.getMinutes();
    const totalMinutes = hour * 60 + minute;
    const day = now.getDay();

    function between(sh,sm,eh,em){
        const start = sh * 60 + sm;
        const end = eh * 60 + em;
        return totalMinutes >= start && totalMinutes < end;
    }

    if(between(0,0,12,30)){
        return "休息時間";
    }

    if(between(12,30,13,0)){
        return `① 打掃騎樓<br>
        ② 確認孩子都有進班，若未通知未出現，記得訊息通知家長`;
    }

    if(between(13,0,13,30)){
        return "整理今日待辦事項";
    }

    if(between(13,30,16,0)){
        let text = "行政工作";

        if(day === 5){
            text += "<br>＋準備下週晚餐單";
        }

        return text;
    }

    if(between(16,0,16,30)){
        return `① 準備點心<br>
        ② 確認孩子都有進班，若未通知未出現，記得訊息通知家長<br>
        ③ 提醒老師傳當日晚餐單`;
    }

    if(hour === 16 && minute >= 30 && minute < 40){
        return "訂晚餐";
    }

    if(hour === 16 && minute >= 40){
        return "倒垃圾";
    }

    if(between(17,0,20,0)){
        return `① 叫學生回家<br>
        ② 行政工作<br>
        ③ 打掃`;
    }

    if(between(20,0,20,30)){
        return `① 晚餐費用、零用金清點<br>
        ② 隔日待辦事項記錄`;
    }

    if(between(20,30,24,0)){
        return "休息時間";
    }

    return "—";
}

let currentCategory = "";
let qIndex = 0;
let score = 0;
let timer;
let timeLeft = 10;

function renderCategories(){

    let html = "";

    Object.keys(questionBank).forEach(cat=>{

        html += `
        <div class="bg-white p-4 rounded-xl hard-shadow cursor-pointer"
             onclick="startGame('${cat}')">
            ${cat}

function startGame(cat){

    clearInterval(timer);

    currentCategory = cat;
    qIndex = 0;
    score = 0;

    openPage("dinoGame",cat+" 闖關");

    nextQ();

}

function nextQ(){

    clearInterval(timer);

    let qs = questionBank[currentCategory];

    if(qIndex >= qs.length){

        saveHistory();

        document.getElementById("game-area").innerHTML = `
            <div class="bg-white p-5 rounded-2xl hard-shadow">
                <h3 class="text-xl font-bold">挑戰完成！</h3>
                <p class="my-3">得分：${score}/${qs.length}</p>
                <button onclick="openPage('dinoCategory','恐龍闖關')"
                        class="mt-3 bg-[#F6D494] p-3 rounded-xl hard-shadow">
                    回到情境分類
                </button>
            </div>`;

        return;

    }

    timeLeft = 10;

    let q = qs[qIndex];

    let html = `
        <div class="bg-white p-4 rounded-2xl hard-shadow">
            <div class="mb-3">
                第 ${qIndex+1} 題／共 ${qs.length} 題
            </div>
            <div class="mb-3">
                剩餘時間：
                <span id="timer" class="font-bold">${timeLeft}</span> 秒
            </div>
            <div class="my-4 font-bold text-lg">${q.q}</div>`;

    q.o.forEach((opt,i)=>{

        html += `
            <button onclick="checkA(${i})"
                    class="block w-full bg-white p-3 mb-3 rounded-xl hard-shadow">
                ${opt}
            </button>`;

    });

    html += "</div>";

    document.getElementById("game-area").innerHTML = html;

    timer = setInterval(()=>{

        timeLeft--;

        const timerElement = document.getElementById("timer");

        if(timerElement){
            timerElement.innerText = timeLeft;
        }

        if(timeLeft <= 0){

            clearInterval(timer);

            qIndex++;

            nextQ();

        }

    },1000);

}

function checkA(i){

    clearInterval(timer);

    if(i === questionBank[currentCategory][qIndex].c){
        score++;
    }

    qIndex++;

    nextQ();

}

function saveHistory(){

    let h = JSON.parse(localStorage.getItem("history") || "[]");

    h.push({
        date:new Date().toLocaleString(),
        category:currentCategory,
        score:score
    });

    localStorage.setItem("history",JSON.stringify(h));

}

function viewHistory(){

    let h = JSON.parse(localStorage.getItem("history") || "[]");

    let html = `
        <h3 class="font-bold mb-3">歷史紀錄</h3>`;

    if(h.length === 0){

        html += `<div class="bg-white p-4 rounded-xl">
            目前還沒有作答紀錄。
        </div>`;

    }else{

        [...h].reverse().forEach(r=>{

            html += `
            <div class="bg-white p-3 mb-2 rounded-xl">
                <div>${r.date}</div>
                <div>${r.category}｜${r.score}分</div>
            </div>`;

        });

    }

    html += `
        <button onclick="renderCategories()"
                class="mt-3 p-3 bg-white rounded-xl hard-shadow">
            返回情境分類
        </button>`;

    document.getElementById("category-list").innerHTML = html;

}

let selectedParentType = "";
let selectedParentQuestion = null;

function showParentMessages(type){

    selectedParentType = type;

    openPage("parentMessages",type);

    document.getElementById("parent-title").innerText = type;

    let html = "";

    parentData[type].forEach((item,index)=>{

        html += `
        <button
            type="button"
            class="block w-full text-left bg-white p-4 rounded-xl hard-shadow message-card"
            onclick="showParentReply('${type}',${index})">

            <div class="text-sm text-gray-500 mb-2">
                問題 ${index+1}
            </div>

            <div class="font-medium leading-relaxed">
                ${item.q}
            </div>

            <div class="text-blue-600 text-sm mt-3">
                查看建議回覆 →
            </div>

        </button>`;

    });

    document.getElementById("parent-message-list").innerHTML = html;

}


/* =========================================

========================================= */

function showParentReply(type,index){

    selectedParentType = type;

    selectedParentQuestion = parentData[type][index];

    const item = selectedParentQuestion;

    document.getElementById("reply-question").innerText = item.q;

    document.getElementById("reply-content").innerText = item.reply;

    document.getElementById("reply-tip").innerText = item.tip;

    document.getElementById("reply-warning").innerText = item.warning;

    document.getElementById("copy-status").innerText = "";

    openPage("parentReply","建議回覆");

}


/* =========================================
   複製回覆
========================================= */

async function copyReply(){

    if(!selectedParentQuestion){
        return;
    }

    const text = selectedParentQuestion.reply;

    try{

        await navigator.clipboard.writeText(text);

        document.getElementById("copy-status").innerText =
            "✓ 已複製，可以貼到訊息對話框了。";

    }catch(error){

        // 部分瀏覽器或非安全環境可能不允許使用 Clipboard API
        const textarea = document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.select();

        const success = document.execCommand("copy");

        document.body.removeChild(textarea);

        document.getElementById("copy-status").innerText =
            success
            ? "✓ 已複製，可以貼到訊息對話框了。"
            : "無法自動複製，請長按回覆文字並手動複製。";

    }

}

    }

    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });

    target.classList.add("active");

    document.getElementById("top-nav").classList.remove("hidden");

    document.getElementById("nav-title").innerText = title;

    stack.push(id);

    window.scrollTo(0,0);

}

function goBack(){

    if(stack.length <= 1){

        stack = ["home"];

        document.querySelectorAll(".page").forEach(p=>{
            p.classList.remove("active");
        });

        document.getElementById("home").classList.add("active");

        document.getElementById("top-nav").classList.add("hidden");

        return;

    }

    stack.pop();

    const prev = stack[stack.length-1] || "home";

    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });

    document.getElementById(prev).classList.add("active");

    document.getElementById("top-nav").classList.toggle(
        "hidden",
        prev === "home"
    );

    const titles = {
        home:"小羅盤",
        daily:"現在行程",
        yearly:"年度行程",
        crisis:"危機處理",
        dinoCategory:"恐龍闖關",
        dinoGame:currentCategory+" 闖關",
        parentCategory:"家長問題分類",
        parentMessages:selectedParentType,
        parentReply:"建議回覆"
    };

    document.getElementById("nav-title").innerText =
        titles[prev] || "小羅盤";

    window.scrollTo(0,0);

}


/* 初始化導航標題 */

document.getElementById("nav-title").innerText = "小羅盤";

</script>

</body>
</html>
